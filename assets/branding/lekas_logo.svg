<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Lekas logo</title>
  <desc>White checkmark on a diagonal indigo to violet gradient.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="225" fill="url(#bg)"/>
  <polyline points="289,556 469,741 779,331" fill="none" stroke="#FFFFFF" stroke-width="128"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/>
  <polyline points="275,540 455,725 765,315" fill="none" stroke="#FFFFFF" stroke-width="128"
            stroke-linecap="round" stroke-linejoin="round"/>
