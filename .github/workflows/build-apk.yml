name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Cache pub and Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle
          key: ${{ runner.os }}-flutter-3.47.0-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-3.47.0-

      - name: Add notification permission to manifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />#' "$MANIFEST"
          sed -i 's/android:label="lekas"/android:label="Lekas"/' "$MANIFEST"

      - name: Alias Android SDK platform 37.0 as android-37
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK platform dirs:"
          ls -la "$SDK/platforms" || true
          if [ ! -e "$SDK/platforms/android-37" ] && [ -d "$SDK/platforms/android-37.0" ]; then
            sudo ln -sfn android-37.0 "$SDK/platforms/android-37"
            echo "Created alias android-37 -> android-37.0"
          fi
          ls -la "$SDK/platforms"

      - name: Install dependencies
        run: flutter pub get

      - name: Enable core library desugaring
        run: |
          APP_GRADLE="android/app/build.gradle.kts"
          if grep -q "isCoreLibraryDesugaringEnabled" "$APP_GRADLE"; then
            sed -i 's/isCoreLibraryDesugaringEnabled\s*=\s*false/isCoreLibraryDesugaringEnabled = true/' "$APP_GRADLE"
          else
            sed -i '/sourceCompatibility/a\        isCoreLibraryDesugaringEnabled = true' "$APP_GRADLE"
          fi
          if ! grep -q "coreLibraryDesugaring" "$APP_GRADLE"; then
            cat >> "$APP_GRADLE" << 'GRADLEOF'

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          GRADLEOF
          fi

      - name: Build APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lekas-apks
          path: build/app/outputs/flutter-apk/*.apk