name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Cache pub and Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle
          key: ${{ runner.os }}-flutter-3.47.0-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-3.47.0-

      - name: Alias Android SDK platform 37.0 as android-37
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "SDK platform dirs:"
          ls -la "$SDK/platforms" || true
          if [ ! -e "$SDK/platforms/android-37" ] && [ -d "$SDK/platforms/android-37.0" ]; then
            sudo ln -sfn android-37.0 "$SDK/platforms/android-37"
            echo "Created alias android-37 -> android-37.0"
          fi
          ls -la "$SDK/platforms"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: lekas-apks
          path: build/app/outputs/flutter-apk/*.apk