name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Cache pub and Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle
          key: ${{ runner.os }}-flutter-3.47.0-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-3.47.0-

      - name: Alias Android SDK platform 37.0 as android-37
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -e "$SDK/platforms/android-37" ] && [ -d "$SDK/platforms/android-37.0" ]; then
            sudo ln -sfn android-37.0 "$SDK/platforms/android-37"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Check the tag matches the pubspec version
        run: |
          RELEASE_VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          if [ "v$RELEASE_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "pubspec says v$RELEASE_VERSION but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Build release notes from the changelog
        run: |
          TAG="$GITHUB_REF_NAME"

          # The changelog entry is "## <tag>", one summary sentence, then the
          # content sections. The notes keep that shape: one sentence per
          # language, the same sections, then Install / Update.
          extract_sections() {
            awk -v tag="$TAG" '
              $0 == "## " tag { grab = 1; next }
              grab && /^## v/ { exit }
              grab && /^### / { show = 1 }
              grab && show { print }
            ' "$1" | sed 's/^### /## /'
          }

          en_summary=$(awk -v tag="$TAG" '
            $0 == "## " tag { grab = 1; next }
            grab && /^## v/ { exit }
            grab && NF > 0 && !/^### / { print; exit }
          ' CHANGELOG.md)
          id_summary=$(awk -v tag="$TAG" '
            $0 == "## " tag { grab = 1; next }
            grab && /^## v/ { exit }
            grab && NF > 0 && !/^### / { print; exit }
          ' CHANGELOG.id.md)

          if [ -z "$en_summary" ] || [ -z "$id_summary" ]; then
            echo "No summary line under ## $TAG"
            exit 1
          fi

          {
            echo "# English"
            echo
            echo "$en_summary"
            echo
            extract_sections CHANGELOG.md
            echo
            echo "## Install / Update"
            echo
            echo "Download the APK matching your device (\`app-arm64-v8a-release.apk\` for most modern phones, \`app-armeabi-v7a-release.apk\` for older 32-bit ones). Open it on your phone and allow installs from unknown sources if asked. Grant notification permission when the app first asks, and leave battery optimization unrestricted for Lekas. Requires Android 7.0 (API 24)."
            echo
            echo "<br>"
            echo
            echo "---"
            echo
            echo "<br>"
            echo
            echo "# Bahasa Indonesia"
            echo
            echo "$id_summary"
            echo
            extract_sections CHANGELOG.id.md
            echo
            echo "## Instalasi / Update"
            echo
            echo "Download APK sesuai HP di bawah (\`app-arm64-v8a-release.apk\` untuk kebanyakan HP modern, \`app-armeabi-v7a-release.apk\` untuk yang 32-bit lama). Buka di HP dan izinkan instalasi dari sumber tidak dikenal bila diminta. Berikan izin notifikasi saat aplikasi pertama kali meminta, dan biarkan optimalisasi baterai tanpa batasan untuk Lekas. Membutuhkan Android 7.0 (API 24)."
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          APKS="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber $APKS
            gh release edit "$TAG" --title "Lekas $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" $APKS \
              --title "Lekas $TAG" \
              --notes-file release-notes.md \
              --verify-tag
          fi
