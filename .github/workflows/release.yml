name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'

      - name: Cache pub and Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle
          key: ${{ runner.os }}-flutter-3.47.0-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-3.47.0-

      - name: Alias Android SDK platform 37.0 as android-37
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -e "$SDK/platforms/android-37" ] && [ -d "$SDK/platforms/android-37.0" ]; then
            sudo ln -sfn android-37.0 "$SDK/platforms/android-37"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Check the tag matches the pubspec version
        run: |
          RELEASE_VERSION=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          if [ "v$RELEASE_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "pubspec says v$RELEASE_VERSION but the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Build release notes from the changelog
        run: |
          TAG="$GITHUB_REF_NAME"
          DESC=$(grep -E "^## $TAG - " CHANGELOG.md | head -n 1 | sed "s/^## $TAG - //")
          if [ -z "$DESC" ]; then
            echo "No changelog entry for $TAG"
            exit 1
          fi

          extract() {
            awk -v tag="$TAG" 'index($0, "## " tag) == 1 {grab=1; next} grab && /^## v/ {exit} grab {print}' "$1" | sed 's/^### /## /'
          }

          {
            echo "# English"
            echo
            echo "**Lekas $TAG - $DESC (EN)**"
            echo
            extract CHANGELOG.md
            echo
            echo "<br>"
            echo
            echo "---"
            echo
            echo "<br>"
            echo
            echo "# Bahasa Indonesia"
            echo
            echo "**Lekas $TAG - $DESC (ID)**"
            echo
            extract CHANGELOG.id.md
          } > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$GITHUB_REF_NAME"
          DESC=$(grep -E "^## $TAG - " CHANGELOG.md | head -n 1 | sed "s/^## $TAG - //")
          APKS="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber $APKS
            gh release edit "$TAG" --title "Lekas $TAG - $DESC" --notes-file release-notes.md
          else
            gh release create "$TAG" $APKS \
              --title "Lekas $TAG - $DESC" \
              --notes-file release-notes.md \
              --verify-tag
          fi
